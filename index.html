<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#111111">
  <title>Abrindo página…</title>
  <meta name="description" content="Você será encaminhado para a página solicitada.">
  <link rel="canonical" href="https://www.crownbot.com.br/natyvampirinha">
  <meta http-equiv="refresh" content="0;url=https://www.crownbot.com.br/natyvampirinha">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      padding: 24px; background: #111; color: #f7f7f7;
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 420px); text-align: center; }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 22px; border-radius: 50%;
      border: 3px solid #3b3b3b; border-top-color: #fff;
      animation: spin .8s linear infinite;
    }
    h1 { margin: 0 0 10px; font-size: clamp(1.35rem, 5vw, 1.8rem); }
    p { margin: 0 0 22px; color: #bdbdbd; }
    a { color: #fff; text-underline-offset: 4px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
  <script>
    // Destino fixo no código; não há campo de edição na página.
    (function () {
      var destination = "https://www.crownbot.com.br/natyvampirinha";
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <main>
    <div class="spinner" aria-hidden="true"></div>
    <h1>Abrindo a página…</h1>
    <p>Você será encaminhado automaticamente.</p>
    <noscript>
      <p>O redirecionamento automático precisa de JavaScript.</p>
      <a href="https://www.crownbot.com.br/natyvampirinha" rel="noopener">Continuar</a>
    </noscript>
  </main>
</body>
</html>
